# Fallback project spec.
#
# CrosswordBonanza.xcodeproj is committed and should open directly in Xcode 16
# or newer. This file exists because that project.pbxproj was written by hand,
# without a Mac to test it on: if Xcode refuses to open it, delete the .xcodeproj
# and regenerate an equivalent one from here.
#
#     brew install xcodegen
#     xcodegen generate
#     open CrosswordBonanza.xcodeproj

name: CrosswordBonanza

options:
  bundleIdPrefix: com.crosswordbonanza
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CrosswordBonanza:
    type: application
    platform: iOS
    sources:
      - path: CrosswordBonanza
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crosswordbonanza.game
        PRODUCT_NAME: CrosswordBonanza
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Crossword Bonanza
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
